<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar · Sistema de Gestión TIZ</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/app.css">
    <script type="module" src="/js/login.js"></script>
</head>
<body class="login-page">
    <main class="login-box">
        <img src="/img/LogoPresupuesto.png" alt="TIZ Publicidad">
        <form id="loginForm" autocomplete="on">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required autocomplete="username" maxlength="160">
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" required autocomplete="current-password" maxlength="128">
            </div>
            <div id="loginError" class="alert bad hidden" role="alert"></div>
            <button class="primary" type="submit">Ingresar</button>
        </form>
    </main>
</body>
</html>
